name: interseguro-coding-challenge
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8081"
    volumes:
      - type: bind
        source: ./.secrets/reviewer.htpasswd
        target: /etc/nginx/auth/reviewer.htpasswd
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      go-api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  node-api:
    build: ./node-api
    environment:
      NODE_PORT: "3000"
      NODE_ENV: production
    ports:
      - "127.0.0.1:${NODE_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  go-api:
    build: ./go-api
    environment:
      GO_PORT: "8080"
      NODE_API_URL: "${NODE_API_URL:-http://node-api:3000}"
      HTTP_TIMEOUT_SECONDS: "${HTTP_TIMEOUT_SECONDS:-5}"
    ports:
      - "127.0.0.1:${GO_PORT:-8080}:8080"
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      node-api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
