worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types application/javascript text/css;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8081;
        root /usr/share/nginx/html;
        client_max_body_size 1m;
        auth_basic "Interseguro Challenge";
        auth_basic_user_file /etc/nginx/auth/reviewer.htpasswd;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "private, no-store, no-transform" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        location = / {
            limit_except GET { deny all; }
            try_files /index.html =404;
        }
        location = /favicon.svg {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/assets/[A-Za-z0-9_.-]+\.(js|css)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/api/v1/(process|matrices/(qr|rotate))$ {
            limit_except POST { deny all; }
            set $go_upstream http://go-api:8080;
            proxy_pass $go_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 12s;
        }
        location / { return 404; }
    }
    server {
        listen 127.0.0.1:8082;
        access_log off;
        location = /health { return 200 "ok\n"; }
        location / { return 404; }
    }
}
